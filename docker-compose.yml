name: payment-intelligence

services:
  backend:
    build:
      context: ./backend
      args:
        WITH_TIMESTRAL: ${WITH_TIMESTRAL:-true}
    environment:
      # Ollama runs on the host. host.docker.internal resolves natively on Docker Desktop (macOS/Windows);
      # the extra_hosts entry below makes it work on Linux too.
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-http://host.docker.internal:11434}
      OLLAMA_LLM_MODEL: ${OLLAMA_LLM_MODEL:-gemma3:4b}
      OLLAMA_EMBED_MODEL: ${OLLAMA_EMBED_MODEL:-embeddinggemma-2}
      OLLAMA_NIMBLE_PATH: ${OLLAMA_NIMBLE_PATH:-/v1/systemone}
      OLLAMA_DECISION_MODEL: ${OLLAMA_DECISION_MODEL:-nimble}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-180}
      ALLOW_OFFLINE_FALLBACK: ${ALLOW_OFFLINE_FALLBACK:-true}
      # Liquidity Guard Strategic Horizon: Timestral runs inside the backend; its weights are cached on a volume.
      FORECAST_MODEL: ${FORECAST_MODEL:-mistralai/Timestral-209M}
      FORECAST_TIMEOUT_SECONDS: ${FORECAST_TIMEOUT_SECONDS:-20}
      HF_HOME: /data/hf
      # Chroma vector store for evidence embeddings, kept on a named volume across restarts.
      CHROMA_DIR: /data/chroma
    volumes:
      - chroma-data:/data/chroma
      - hf-cache:/data/hf
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build: ./frontend
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "3000:80"

volumes:
  chroma-data:
  hf-cache:
